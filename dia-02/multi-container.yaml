apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-container-app
    run: multi-container
spec:
  containers:
    - name: girus-nginx-1
      image: nginx
      ports:
        - containerPort: 80
    - name: girus-alpine-2
      image: alpine
      args:
        - sleep
        - "1800"