apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-nginx-deployment
  name: my-nginx-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: my-nginx-deployment
  strategy: {}
  template:
   metadata:
     labels:
       app: my-nginx-deployment
   spec:
     containers:
      - name: nginx
        image: nginx:latest
        ports:
          - containerPort: 80
        resources:
          limits:
            memory: 256Mi
            cpu: 0.5
          requests:
            memory: 128Mi
            cpu: 0.3
          