apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-nginx-deployment
  name: my-nginx-deployment
  namespace: development
spec:
  replicas: 10
  selector:
    matchLabels:
      app: my-nginx-deployment
  strategy: 
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
   metadata:
     labels:
       app: my-nginx-deployment
   spec:
     containers:
      - name: nginx
        image: nginx:1.15.0
        ports:
          - containerPort: 80
        resources:
          limits:
            memory: 256Mi
            cpu: 0.5
          requests:
            memory: 128Mi
            cpu: 0.3
          